services:
  redis:
    image: redis:7-alpine
    container_name: go-analytics-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres_analytics:
    image: postgres:16-alpine
    container_name: go-analytics-postgres
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ./migrations/postgres:/migrations:ro
    depends_on:
      postgres_analytics:
        condition: service_healthy
    entrypoint: ["migrate"]
    command:
      [
        "-path=/migrations",
        "-database=postgres://analytics:analytics@postgres_analytics:5432/analytics?sslmode=disable",
        "up"
      ]

volumes:
  redis_data:
  postgres_analytics_data:
