name: go-analytics-sandbox
services:
  analytics-ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    container_name: go-analytics-ingest
    env_file:
      - .env.example
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      go_network:
        aliases:
          - ingest
          - go-ingest
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "5"

  analytics-worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: go-analytics-worker
    env_file:
      - .env.example
    # ports:
    #   - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      postgres_analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      go_network:
        aliases:
          - worker
          - go-worker
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: go-analytics-redis
    command: ["redis-server", "--appendonly", "yes"]
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      go_network:
        aliases:
          - redis

  postgres_analytics:
    image: postgres:16-alpine
    container_name: go-analytics-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    ports:
      - "5433:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-analytics} -d $${POSTGRES_DB:-analytics}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      go_network:
        aliases:
          - postgres
          - postgres_analytics

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ./migrations/postgres:/migrations:ro
    depends_on:
      postgres_analytics:
        condition: service_healthy
    entrypoint: ["migrate"]
    command:
      [
        "-path=/migrations",
        "-database=postgres://${POSTGRES_USER:-analytics}:${POSTGRES_PASSWORD:-analytics}@postgres_analytics:5432/${POSTGRES_DB:-analytics}?sslmode=${POSTGRES_SSLMODE:-disable}",
        "up"
      ]
    networks:
      - go_network

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: go-analytics-sandbox
    env_file:
      - .env.example
    environment:
      ENV_FILE: ""
    ports:
      - "3000:3000"
    volumes:
      - ./docs:/docs:ro
      - ./packages/web-sdk/dist:/sdk:ro
      - ./sandbox/public:/app/public:ro
    depends_on:
      postgres_analytics:
        condition: service_healthy
    networks:
      go_network:
        aliases:
          - sandbox
          - go-sandbox
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "5"

volumes:
  redis_data:
  postgres_analytics_data:

networks:
  go_network:
    driver: bridge
