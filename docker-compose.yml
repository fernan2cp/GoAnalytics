services:
  analytics-ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    container_name: go-analytics-ingest
    env_file:
      - .env.devel
    environment:
      ENV_FILE: ""
      REDIS_ADDR: redis:6379
      INGEST_HTTP_HOST: 0.0.0.0
      INGEST_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      go_network:
        aliases:
          - go-ingest
        ipv4_address: 172.30.1.1
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "5"

  analytics-worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: go-analytics-worker
    env_file:
      - .env.devel
    environment:
      ENV_FILE: ""
      REDIS_ADDR: redis:6379
      POSTGRES_HOST: postgres_analytics
      POSTGRES_PORT: 5432
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
      WORKER_HEALTH_HTTP_HOST: 0.0.0.0
      WORKER_HEALTH_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      postgres_analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8081/ready >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      go_network:
        aliases:
          - go-worker
        ipv4_address: 172.30.1.2
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: go-analytics-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres_analytics:
    image: postgres:16-alpine
    container_name: go-analytics-postgres
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "5433:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ./migrations/postgres:/migrations:ro
    depends_on:
      postgres_analytics:
        condition: service_healthy
    entrypoint: ["migrate"]
    command:
      [
        "-path=/migrations",
        "-database=postgres://analytics:analytics@postgres_analytics:5432/analytics?sslmode=disable",
        "up"
      ]

volumes:
  redis_data:
  postgres_analytics_data:

networks:
  go_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    name: go_network